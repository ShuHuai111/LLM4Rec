project_name: GenRec
version: 0.1.0
seed: 42
device: cuda
dataset: ml-1m
processed_data_dir: data/processed/ml-1m
items_path: data/processed/ml-1m/items.csv
max_seq_len: 50
top_k: 10
num_workers: 0
semantic_id:
  quantizer_mode: baseline
  output_dir: data/processed/ml-1m/semantic_id/TIGER_baseline
  encoder:
    n_components: 32
    text_columns:
    - title
    - genres
    max_features: 20000
    ngram_range:
    - 1
    - 2
    min_df: 1
    max_df: 1.0
    lowercase: true
    normalize_embeddings: true
  quantizer:
    codebook_size: 64
    num_codebooks: 3
    n_init: 10
    max_iter: 300
    distance_batch_size: 4096
semantic_sequence:
  output_dir: data/processed/ml-1m/semantic_sequences/TIGER_baseline
  max_seq_len: 50
  min_history_len: 1
tiger:
  vocab_size: 260
  max_history_tokens: 250
  target_token_length: 5
  embedding_dim: 64
  num_heads: 2
  num_layers: 2
  feed_forward_dim: 128
  dropout: 0.1
  pad_token_id: 0
  bos_token_id: 258
  eos_token_id: 259
  batch_size: 32
  learning_rate: 0.001
  epochs: 3
  weight_decay: 1.0e-05
  grad_clip_norm: 5.0
  patience: 2
  result_dir: results/ml-1m/tiger/TIGER_baseline
  checkpoint_path: checkpoints/ml-1m/tiger/TIGER_baseline_best.pt
tiger_evaluation:
  semantic_dir: D:\LLM\LLM4Rec\data\processed\ml-1m\semantic_id\TIGER_baseline
  checkpoint_path: D:\LLM\LLM4Rec\checkpoints\ml-1m\tiger\TIGER_baseline_best.pt
  output_dir: D:\LLM\LLM4Rec\results\ml-1m\tiger\TIGER_baseline
  top_k: 10
  beam_width: 16
  temperature: 1.0
  device: cuda
  max_users: null
