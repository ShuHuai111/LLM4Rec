project_name: GenRec
version: 0.1.0
seed: 42
device: cuda
dataset: ml-100k
adapter: movielens_100k
data_dir: data
raw_data_dir: data/raw/ml-100k
processed_data_dir: data/processed/ml-100k
interactions_path: data/processed/ml-100k/interactions.csv
items_path: data/processed/ml-100k/items.csv
positive_rating_threshold: 4
positive_only: true
min_user_interactions: 5
min_item_interactions: 5
item_count_mode: unique_users
max_filter_rounds: 100
result_dir: results
checkpoint_dir: checkpoints
log_dir: logs
item_knn:
  neighbor_k: 50
  result_dir: results/ml-100k/item-KNN
time_aware_item_knn:
  neighbor_k: 50
  time_decay_enabled: true
  time_half_life_days: 7
  popularity_penalty_enabled: false
  popularity_penalty_alpha: 0.25
  popularity_count_mode: unique_users
  result_dir: results/ml-100k/time-aware-popularity-item-knn
sasrec:
  embedding_dim: 64
  num_heads: 2
  num_layers: 2
  feed_forward_dim: 128
  dropout: 0.2
  weight_decay: 1.0e-05
  grad_clip_norm: 5.0
  patience: 3
  result_dir: results/ml-100k/sasrec
  checkpoint_path: checkpoints/ml-100k/sasrec_best.pt
advanced_sasrec:
  embedding_dim: 64
  num_heads: 2
  num_layers: 2
  feed_forward_dim: 128
  dropout: 0.2
  weight_decay: 1.0e-05
  grad_clip_norm: 5.0
  patience: 3
  result_dir: results/ml-100k/advanced-sasrec
  checkpoint_dir: checkpoints/ml-100k/advanced-sasrec
tiger:
  vocab_size: 196
  max_history_tokens: 200
  target_token_length: 4
  embedding_dim: 64
  num_heads: 2
  num_layers: 2
  feed_forward_dim: 128
  dropout: 0.1
  pad_token_id: 0
  bos_token_id: 194
  eos_token_id: 195
  batch_size: 8
  learning_rate: 0.001
  epochs: 10
  weight_decay: 1.0e-05
  grad_clip_norm: 5.0
  patience: 3
  result_dir: results/ml-100k/tiger
  checkpoint_path: checkpoints/ml-100k/tiger_best.pt
semantic_id:
  quantizer_mode: advanced
  output_dir: data/processed/ml-100k/semantic_id/advanced
  encoder:
    n_components: 32
    text_columns:
    - title
    - genres
    max_features: 20000
    ngram_range:
    - 1
    - 2
    min_df: 1
    max_df: 1.0
    lowercase: true
    normalize_embeddings: true
  quantizer:
    codebook_size: 64
    num_codebooks: 3
    n_init: 10
    max_iter: 300
    distance_batch_size: 4096
  beam_width: 32
  branch_width: 8
max_seq_len: 50
top_k: 10
batch_size: 32
num_workers: 0
split_strategy: leave_last_two
learning_rate: 0.001
epochs: 10
runtime:
  sequence_dir: D:\LLM\LLM4Rec\data\processed\ml-100k\semantic_sequences\advanced
  output_dir: D:\LLM\LLM4Rec\results\ml-100k\tiger
  checkpoint_path: D:\LLM\LLM4Rec\checkpoints\ml-100k\tiger_best.pt
  device: cuda
  num_workers: 0
  max_train_samples: null
  max_valid_samples: null
